apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: mlflow
  namespace: mlflow
spec:
  output:
    to:
      kind: ImageStreamTag
      name: mlflow:3.10.1
  resources:
    limits:
      cpu: "2"
      memory: 4Gi
  source:
    dockerfile: |
      FROM python:3.11-slim
      RUN apt-get update && apt-get install -y --no-install-recommends \
          libpq-dev gcc && \
          rm -rf /var/lib/apt/lists/*
      RUN pip install --no-cache-dir \
          "mlflow[genai]==3.10.1" \
          psycopg2-binary
      RUN useradd -m -u 1000 mlflow
      USER 1000
      EXPOSE 5000
      CMD ["mlflow", "server", \
           "--host", "0.0.0.0", \
           "--port", "5000"]
    type: Dockerfile
  strategy:
    dockerStrategy: {}
    type: Docker
  successfulBuildsHistoryLimit: 5
  failedBuildsHistoryLimit: 5
