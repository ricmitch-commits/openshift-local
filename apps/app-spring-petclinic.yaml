apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-spring-petclinic
  namespace: openshift-gitops
spec:
  destination:
    namespace: spring-petclinic
    server: https://kubernetes.default.svc
  project: default
  source:
    plugin:
      name: manifest-validator    
    repoURL: https://github.com/ricmitch-commits/openshift-local.git
    targetRevision: main
    path: manifests/spring-petclinic/app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
